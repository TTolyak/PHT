<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
    <title>Personal Habit Tracker</title>
</head>
<body class="theme-{{ theme }}">
    <a href="/main"><img src="{{ url_for('static', filename='images/arrow.png') }}" alt="Вернуться назад" id="one_image"></a>
    <div id="one_div">
        <div id="two_div">
            {% if user.avatar %}
                <img src="{{ url_for('static', filename='uploads/'+ user.avatar) }}" alt="Аватар" class="photo">
            {% else %}
                <img src="{{ url_for('static', filename='images/photo.jpg') }}" alt="Профиль" class="photo">
            {% endif %}
        </div>

        <p class="text" ><b>Имя:</b> {{ user.username }} </p>
        <p class="text" ><b>Почта:</b> {{ user.email }} </p>
        <p class="text" ><b>Пароль:</b> ******** </p>

        <a href="/add_avatar"><button id="one" type="submit"><b>Добавить фото</b></button></a>

        <a href="/change_password"><button id="two" type="submit"><b>Изменить пароль</b></button></a>

        <form method="GET" action="{{ url_for('logout') }}">
            <button id="three" type="submit">Выйти</button>
        </form>

    </div>
</body>
</html>
