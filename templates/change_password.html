<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/change_password.css') }}">
    <title>Personal Habit Tracker</title>
</head>
<body class="theme-{{ theme }}">
    <a href="{{url_for('profile', username=user.username)}}"><img src="{{ url_for('static', filename='images/arrow.png') }}" alt="Вернуться назад" id="one_image"></a>
    <div>
        <form method="POST" action="{{ url_for('change_password') }}">
            <b><p>Введите старый пароль:</p></b>
            <input id="one_input" type="password" name="password_one" required>
            <b><p>Введите новый пароль:</p></b>
            <input id="two_input" type="password" name="password_two" required>
            <b><p>Повторите новый пароль:</p></b>
            <input id="three_input" type="password" name="password_three" required>
            <button type="submit"><b>Изменить пароль</b></button>
        </form>
    </div>
</body>
</html>
