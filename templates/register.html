<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename = 'css/register.css') }}">
    <title>Personal Habit Tracker</title>
</head>
<body class="theme-{{ theme }}">
    <a href="/"><img src="{{ url_for('static', filename='images/arrow.png') }}" alt="Вернуться назад" id="one_image"></a>

    <div id="one_div">
        <form method="POST" action="/register">
            <div class="one">
                <label>Имя пользователя:</label>
                <input type="text" name="username" required>
            </div>

            <div class="one">
                <label>Email:</label>
                <input id="one_input" type="email" name="email" required>
            </div>

            <div class="one">
                <label>Пароль:</label>
                <input id="two_input" type="password" name="password" required>
            </div>

            <button id="id" type="submit">Зарегистрироваться</button>
        </form>
    </div>
</body>
</html>
