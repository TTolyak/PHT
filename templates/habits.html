<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/habits.css') }}">
    <title>Personal Habit Tracker</title>
</head>
<body class="theme-{{ theme }}" >
    <a href="/main"><img src="{{ url_for('static', filename='images/arrow.png') }}" alt="Вернуться назад" id="one_image"></a>

    <div id="one_div">
        <b><p id="one_text">Выберите те привычки, которые будете отслеживать.
            После этого вы сможете просматривать свою активность в разделе "Отслеживание" </p></b>
    </div>

    <div id="two_div" class="habits-wrapper">
        <h2 id="two_text">Список привычек</h2>

        <div class="habits-container">
            {% for habit in habits %}
                <div class="habit-item">
                    <b>
                        <a id="three_text" href="{{ url_for('toggle_habit', habit_id=habit.id) }}">
                            <br>
                            {{ habit.name }}
                        </a>
                    </b>
                </div>
            {% endfor %}
        </div>

        <b><p id="four_text">Добавить привычку - клик <br> Удалить - повторный клик</p></b>

    </div>

</body>
</html>
