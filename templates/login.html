<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <title>Personal Habit Tracker</title>
</head>
<body>
    <a href="/"><img src="{{ url_for('static', filename='images/arrow.png') }}" alt="Вернуться назад" id="one_image"></a>

    <div id="one_div">
        <form method="POST" action="/login">
            <div class="one">
                <label>Имя пользователя:</label>
                <input type="text" name="username" required>
            </div>

            <div class="one">
                <label>Пароль:</label>
                <input id="one_input" type="password" name="password" required>
            </div>

            <button id="id" type="submit">Войти</button>
        </form>
    </div>
</body>
</html>
