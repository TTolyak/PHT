<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <title>Personal Habit Tracker</title>
</head>
<body class="theme-{{ theme }}" >
    <div class="container">

        <div id="one_div">
            {% if session.get('user_id') %}
                <a href="/profile/{{ session.get('username') }}" id = "one_a">
                    <div id="six_div">
                        {% if user.avatar %}
                            <img src="{{ url_for('static', filename='uploads/'+ user.avatar) }}" alt="Аватар" class="photo">
                        {% else %}
                            <img src="{{ url_for('static', filename='images/photo.jpg') }}" alt="Профиль" class="photo">
                        {% endif %}
                    </div>
                </a>
            {% endif %}

            <div id="seven_div">
                <b><p id="four_text">Выбор тем:</p></b>
                <b><p class="p"><a href="{{ url_for('set_theme', theme_name='standard') }}">Стандартная</a></p></b>
                <b><p class="p"><a href="{{ url_for('set_theme', theme_name='melon') }}">Нежная дыня</a></p></b>
            </div>

        </div>

        <div id="two_div">
            <b><p id="one_text">Важно знать!</p></b>

            <div id="three_div"><img src="static/images/vision.jpg" alt="Вред зрению" id= "two_photo"></div>

            <a href="/info_vision"><p id="two_text">Все про вред злоупотребления гаджетов</p></a>

            <div id="four_div"><img src="static/images/tonus.png" alt="Держи себя в порядке!" id= "three_photo"></div>

            <a href="/info_tonus"><p id="three_text">Как держать себя в тонусе?</p></a>
        </div>

        <div id="five_div"></div>
    </div>
</body>
</html>
